plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Flutter 3.19: versionCode/versionName KHÔNG nằm trong `flutter {}` extension (chỉ Flutter
// mới hơn có); công cụ flutter ghi chúng vào local.properties từ `version:` trong pubspec.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}
def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
} else {
    logger.warn("WARNING: android/key.properties không tồn tại -> bản release đang ký bằng khoá DEBUG (không nộp được Google Play).")
}

android {
    // Day 2: đổi từ "com.example.image_processing_app" (giá trị template) sang tên riêng.
    // namespace = package Java/Kotlin nội bộ (dùng để resolve ".MainActivity" trong Manifest).
    namespace = "com.medassist.app"
    // Day 26: ML Kit cần compileSdk >= 34; pin 35 cho ổn định.
    compileSdk = 35
    // Day 2: pin NDK về bản ĐÃ CÀI trên máy (26.3.11579264).
    // Mặc định của Flutter 3.19 là 25.1.8937393 nhưng máy chưa có -> Gradle sẽ cố tải NDK
    // (cần cmdline-tools, hiện đang thiếu) => build fail. App chưa có plugin native nên
    // dùng NDK nào cũng được; khi thêm plugin native thì kiểm tra lại giá trị này.
    ndkVersion = "26.3.11579264"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // applicationId = định danh app trên Google Play (KHÔNG đổi được sau khi publish -> chốt trước Day 30).
        applicationId = "com.medassist.app"
        // minSdk 26 (Android 8.0): cần cho các bước sau (tflite_flutter cần API >= 26,
        // ML Kit cần >= 21) và giảm ma trận thiết bị phải hỗ trợ.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    // Day 30: 3 môi trường cài song song được (applicationId khác nhau). Chạy/build luôn cần
    // `--flavor`, kèm `--dart-define=APP_FLAVOR=...` và API_BASE_URL tương ứng (docs/RELEASE.md).
    // applicationId của prod giữ nguyên `com.medassist.app` (đã chốt trước khi publish).
    flavorDimensions = ["env"]
    productFlavors {
        dev {
            dimension = "env"
            applicationIdSuffix = ".dev"
            manifestPlaceholders = [appLabel: "MedAssist Dev"]
        }
        staging {
            dimension = "env"
            applicationIdSuffix = ".staging"
            manifestPlaceholders = [appLabel: "MedAssist Staging"]
        }
        prod {
            dimension = "env"
            manifestPlaceholders = [appLabel: "MedAssist"]
        }
    }

    // Day 30: ký bản release bằng keystore riêng của chủ dự án (xem docs/RELEASE.md).
    // `android/key.properties` + keystore nằm ngoài git (android/.gitignore) và KHÔNG
    // bao giờ được commit. Mẫu các khoá: android/key.properties.example (giá trị giả).
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // ⚠️ Thiếu key.properties thì rơi về khoá debug để `flutter run --release` còn chạy
            // được trên máy dev. Bản như vậy KHÔNG nộp được lên Google Play — cảnh báo ở trên.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
