# Eval suite cho MedAssist agent pipeline — Day 24.
#
# Mỗi case gồm: id, category, question, expect (answered, refusal_reason,
# has_citations, disclaimer_contains).
#
# Dữ liệu test hoàn toàn GIẢ — không lấy thông tin y tế thật.
# Chỉ dùng 10 thuốc mẫu trong data/medicines.dev.csv.
#
# Chạy: python eval.py

version: 1

cases:

  # ===== LOOKUP — tra cứu trực tiếp theo tên thuốc =============================
  # Kỳ vọng: answered=True, có trích dẫn, disclaimer chứa "DỮ LIỆU MẪU"

  - id: lookup_001
    category: lookup
    question: "Panadol 500mg là thuốc gì?"
    expect:
      answered: true
      has_citations: true
      disclaimer_contains: "DỮ LIỆU MẪU"

  - id: lookup_002
    category: lookup
    question: "Cho tôi biết thông tin về Hapacol 500"
    expect:
      answered: true
      has_citations: true

