name: image_processing_app
description: "Medicine recognition app with on-device AI."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Khớp Flutter 3.19.4 / Dart 3.3.2 đang cài trên máy.
  # Khi nâng Flutter lên >= 3.24 (Day 26 - ML Kit) thì đổi thành ^3.5.3.
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  # SDK package (đi kèm Flutter, KHÔNG tải từ pub.dev) — cần cho `vi` vì
  # Material widgets của Flutter có bản dịch sẵn cho nhiều ngôn ngữ.
  flutter_localizations:
    sdk: flutter

  # --- Đang được dùng bởi code hiện tại ---
  cupertino_icons: ^1.0.8
  http: ^0.13.6          # sẽ được thay bằng dio ở Day 5-9 khi tách tầng adapter
  image_picker: ^1.1.2

  # --- Nền tảng cho các bước P1 (thêm sẵn để Day 5+ không phải sửa pubspec) ---
  dio: ^5.4.3+9                    # ApiClient          (Day 5)
  flutter_riverpod: ^2.4.9         # state management   (Day 9)
  flutter_secure_storage: ^9.2.2   # lưu token          (Day 11)
  shared_preferences: ^2.2.3       # cache offline      (Day 12)
  # `flutter_localizations` (SDK) ghim intl 0.18.1 -> constraint phải khớp,
  # nếu không `pub get` không giải được (đã gặp đúng lỗi này).
  intl: 0.18.1                  # i18n vi/en         (Day 13)

  # --- Day 26: On-device OCR + Hybrid ---
  google_mlkit_text_recognition: ^0.13.0  # ML Kit OCR offline
  path_provider: ^2.1.3                   # thư mục app data

  # --- Day 27: Memory & nhắc uống thuốc ---
  sqflite: ^2.3.2                         # SQLite local (hồ sơ sức khoẻ)
  flutter_local_notifications: ^17.2.1    # nhắc uống thuốc
  timezone: ^0.9.4                        # zonedSchedule: nhắc đúng giờ đã chọn (đã duyệt 2026-10-28)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Bật sinh code dịch chuỗi: `flutter gen-l10n` (Day 13).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  assets:
    - assets/models/
    - assets/data/medical_facilities.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
